name: Publish

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    # Refresh data daily at 08:00 UTC (after overnight FPL processing)
    - cron: "0 8 * * *"

permissions:
  contents: read

jobs:
  build:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Fetch FPL data
        run: node scripts/fetch.js
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID || '6371' }}

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /joint-fantasy-dashboard-2027

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
